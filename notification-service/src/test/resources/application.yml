remind:
  cron: 0 0 0 * * *
  email:
    text: "Hey, {0}! We''ve missed you here on PiggyMetrics. It''s time to check your budget statistics.\r\n\r\nCheers,\r\nPiggyMetrics team"
    subject: PiggyMetrics reminder

backup:
  cron: 0 0 12 * * *
  email:
    text: "Howdy, {0}. Your account backup is ready.\r\n\r\nCheers,\r\nPiggyMetrics team"
    subject: PiggyMetrics account backup
    attachment: backup.json

spring:
  cloud:
    config:
      enabled: false
    openfeign:
      circuitbreaker:
        enabled: true
  data:
    mongodb:
      database: piggymetrics
  rabbitmq:
    listener:
      simple:
        auto-startup: false
  mail:
    host: smtp.gmail.com
    port: 465
    username: test
    password: test
    properties:
      mail:
        smtp:
          auth: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
          ssl:
            enable: true
  security:
    oauth2:
      client:
        registration:
          notification-service:
            client-id: notification-service
            client-secret: test
            authorization-grant-type: client_credentials
            scope: server
            provider: auth-service
        provider:
          auth-service:
            token-uri: http://localhost:5000/uaa/oauth/token

de:
  flapdoodle:
    mongodb:
      embedded:
        version: 7.0.14

eureka:
  client:
    enabled: false

management:
  tracing:
    enabled: false

security:
  oauth2:
    resource:
      user-info-uri: http://localhost:5000/uaa/users/current
